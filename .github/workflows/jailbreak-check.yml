name: DirtyFrag VR 集成验证
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 验证内核模块交接路径及 ELF 布局
        run: python3 tests/check_dirtyfrag.py
      - name: 安装 SDK、NDK 与 CMake
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;latest'
          # Accept newly required NDK licenses; ignore only yes SIGPIPE, not sdkmanager failures.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.13113456' 'cmake;3.22.1'
      - name: 编译未签名 Release
        run: bash gradlew :app:assembleRelease -ParashiUnsignedRelease=true --no-daemon --stacktrace
      - name: 检查实际 APK
        run: |
          python3 tests/check_dirtyfrag.py app/build/outputs/apk/release/app-release-unsigned.apk
          python3 tests/check_release_apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Arashi-DirtyFrag-VR-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
