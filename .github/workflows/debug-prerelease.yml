name: Debug APK v1.2.0 预发布
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arashi-debug-prerelease
  cancel-in-progress: false
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;latest'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: 校验 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Arashi-1.2.0-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose dist/Arashi-1.2.0-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging dist/Arashi-1.2.0-debug.apk > "$RUNNER_TEMP/badging.txt"
          grep "package: name='com.lijinmu.arashi' versionCode='47' versionName='v1.2.0'" "$RUNNER_TEMP/badging.txt"
          grep 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          test "$(unzip -p dist/Arashi-1.2.0-debug.apk META-INF/xposed/java_init.list)" = 'com.lijinmu.arashi.xposed.HookEntry'
          (cd dist && sha256sum Arashi-1.2.0-debug.apk > SHA256SUMS-debug.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Arashi-1.2.0-Debug-APK
          path: dist/*
          if-no-files-found: error
      - name: 发布 v1.2.0 预发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'Debug 测试版本。\n\n源码提交：%s\n\n锁屏通知裁剪等修改尚待真机验证。使用 Android Debug 签名。\n' "$BUILD_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create v1.2.0 --target "$BUILD_SHA" --title 'v1.2.0 预发布' --prerelease --notes-file "$RUNNER_TEMP/release-notes.md" dist/Arashi-1.2.0-debug.apk dist/SHA256SUMS-debug.txt
