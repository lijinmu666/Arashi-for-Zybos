name: Debug APK 预发布
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arashi-debug-prerelease
  cancel-in-progress: false
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 安装 Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;latest'
          # Accept newly required NDK licenses; ignore only yes SIGPIPE, not sdkmanager failures.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.13113456' 'cmake;3.22.1'
      - name: 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: 读取 APK 版本信息
        shell: bash
        run: |
          set -euo pipefail
          metadata="app/build/outputs/apk/debug/output-metadata.json"
          code="$(jq -er '.elements[0].versionCode | numbers' "$metadata")"
          version="$(jq -er '.elements[0].versionName | strings' "$metadata")"
          [[ "$code" =~ ^[0-9]+$ && "$version" =~ ^v?[0-9]+([.][0-9]+)*([A-Za-z0-9._-]*)?$ ]]
          echo "ARASHI_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "ARASHI_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "ARASHI_VERSION_TAG=v${version#v}" >> "$GITHUB_ENV"
      - name: 校验 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Arashi-${ARASHI_VERSION_NAME}-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose dist/Arashi-${ARASHI_VERSION_NAME}-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging dist/Arashi-${ARASHI_VERSION_NAME}-debug.apk > "$RUNNER_TEMP/badging.txt"
          grep "package: name='com.lijinmu.arashi' versionCode='${ARASHI_VERSION_CODE}' versionName='${ARASHI_VERSION_NAME}'" "$RUNNER_TEMP/badging.txt"
          grep 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          test "$(unzip -p dist/Arashi-${ARASHI_VERSION_NAME}-debug.apk META-INF/xposed/java_init.list)" = 'com.lijinmu.arashi.xposed.HookEntry'
          (cd dist && sha256sum Arashi-${ARASHI_VERSION_NAME}-debug.apk > SHA256SUMS-debug.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Arashi-${{ env.ARASHI_VERSION_NAME }}-Debug-APK
          path: dist/*
          if-no-files-found: error
      - name: 发布 Debug 预发布
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'Debug 测试版本。\n\n源码提交：%s\n\n锁屏通知裁剪等修改尚待真机验证。使用 Android Debug 签名。\n' "$BUILD_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$ARASHI_VERSION_TAG" --target "$BUILD_SHA" --title "$ARASHI_VERSION_TAG 预发布" --prerelease --notes-file "$RUNNER_TEMP/release-notes.md" dist/Arashi-${ARASHI_VERSION_NAME}-debug.apk dist/SHA256SUMS-debug.txt
