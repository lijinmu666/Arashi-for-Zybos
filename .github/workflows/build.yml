name: 编译 Arashi 1.0.0 APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      unsigned_release:
        description: 生成未签名 Release APK
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: arashi-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARASHI_UNSIGNED_RELEASE: ${{ github.event_name == 'push' || inputs.unsigned_release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 验证后台保留白名单规则
        shell: bash
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/background-tests" app/src/main/java/com/arashi/xposed/BackgroundPolicy.java tests/BackgroundPolicyCheck.java
          java -cp "$RUNNER_TEMP/background-tests" BackgroundPolicyCheck
      - name: 验证 Android 12 和 14 设置菜单兼容性
        shell: bash
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/settings-tests" app/src/main/java/com/arashi/xposed/Reflect.java app/src/main/java/com/arashi/xposed/SettingsHeaderCompat.java tests/SettingsHeaderCompatCheck.java
          java -cp "$RUNNER_TEMP/settings-tests" SettingsHeaderCompatCheck
      - name: 验证状态栏日期格式
        shell: bash
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/clock-tests" app/src/main/java/com/arashi/xposed/StatusBarClockFormat.java tests/StatusBarClockFormatCheck.java
          java -cp "$RUNNER_TEMP/clock-tests" StatusBarClockFormatCheck
      - name: 安装 Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmdline-tools;latest'
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=3 > "$RUNNER_TEMP/sdk-packages.txt"
          grep -E 'platforms;android-|build-tools;37|cmdline-tools;' "$RUNNER_TEMP/sdk-packages.txt"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: 准备签名
        if: env.ARASHI_UNSIGNED_RELEASE != 'true'
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            python3 - <<'PY'
          import base64, os, pathlib
          key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'arashi-signing.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          props = {'storeFile': str(key), 'storePassword': os.environ['STORE_PASSWORD'],
                   'keyAlias': os.environ['KEY_ALIAS'], 'keyPassword': os.environ['KEY_PASSWORD']}
          target = pathlib.Path('keystore.properties')
          target.write_text(''.join(k + '=' + escape(v) + '\n' for k, v in props.items()))
          target.chmod(0o600)
          PY
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo '未配置完整正式签名 Secrets，将生成测试签名 APK 和未签名 Release APK。'
          fi
      - name: 编译 APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:assembleDebug -ParashiUnsignedRelease="$ARASHI_UNSIGNED_RELEASE" --no-daemon --stacktrace
      - name: 校验并整理 APK
        env:
          OFFICIAL_SIGNED: ${{ steps.signing.outputs.signed }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tools="$ANDROID_HOME/build-tools/37.0.0"
          if [[ "$OFFICIAL_SIGNED" == 'true' ]]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Arashi-1.0.0-release.apk
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/Arashi-1.0.0-release-unsigned.apk
            cp app/build/outputs/apk/debug/app-debug.apk dist/Arashi-1.0.0-test.apk
          fi
          for apk in dist/*.apk; do
            "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/arashi-badging.txt"
            grep "package: name='com.arashi' versionCode='37' versionName='v1.0.0'" "$RUNNER_TEMP/arashi-badging.txt"
            test "$(unzip -p "$apk" META-INF/xposed/java_init.list)" = 'com.arashi.xposed.HookEntry'
            if [[ "$apk" != *-unsigned.apk ]]; then
              "$tools/apksigner" verify --verbose --print-certs "$apk"
            elif "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then
              echo '预期未签名的 Release APK 包含有效签名'
              exit 1
            fi
          done
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Arashi-1.0.0-APKs
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: 清除临时签名文件
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/arashi-signing.jks"
