plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasSigningConfig = keystorePropsFile.exists() &&
        !providers.gradleProperty('arashiUnsignedRelease').map { it.toBoolean() }.getOrElse(false)
if (hasSigningConfig) {
    keystorePropsFile.withInputStream { stream -> keystoreProps.load(stream) }
}

android {
    namespace = 'com.lijinmu.arashi'
    compileSdk = 37
    ndkVersion = '29.0.13113456'
    defaultConfig {
        applicationId 'com.lijinmu.arashi'
        minSdk = 31
        targetSdk = 34
        versionCode = 80
        versionName = '1.3.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    if (hasSigningConfig) {
        signingConfigs {
            release {
                storeFile = rootProject.file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
            }
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig = signingConfigs.release
            }
        }
    }
    // Miuix NavDisplay's inline entry API is published with JVM target 21.
    // AGP's built-in Kotlin also derives its jvmTarget from targetCompatibility.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigationevent:navigationevent-compose:1.1.2'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-nav-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
